name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests (C# 5, mono)
    runs-on: ubuntu-latest
    container: mono:6.12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run
        run: |
          mcs -langversion:5 -nowarn:618 -out:/tmp/tests.exe -r:System.Core.dll \
              -resource:shared/web-player.html,web-player.html \
              windows/src/Engine/*.cs windows/tests/EngineTests.cs
          mono /tmp/tests.exe

  windows:
    name: Windows app + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (csc from .NET Framework 4.8) and render docs
        shell: pwsh
        run: |
          $env:DUALEARBUDS_DATA = "$env:RUNNER_TEMP\de-data"
          powershell -ExecutionPolicy Bypass -File windows\build.ps1 -Docs
      - name: Installer QA (sandboxed install / repair / modify / uninstall)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File windows\tests\setup-qa.ps1
      - name: UI smoke test (every page, both themes, offscreen)
        shell: pwsh
        run: |
          $env:DUALEARBUDS_DATA = "$env:RUNNER_TEMP\de-data"
          $p = Start-Process windows\dist\DualEarbuds.exe -ArgumentList '--uitest', "$env:RUNNER_TEMP\uitest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\uitest.txt"
          if ($p.ExitCode -ne 0) { throw 'UI test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows/dist/DualEarbuds-Setup.exe
            windows/dist/DualEarbuds.exe
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key (stable across releases, so in-app updates install)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Unit tests + release APK
        working-directory: android
        env:
          DE_KEYSTORE: ${{ runner.temp }}/release.jks
          DE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/*.apk DualEarbuds.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DualEarbuds.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/windows/DualEarbuds-Setup.exe
            out/android/DualEarbuds.apk
